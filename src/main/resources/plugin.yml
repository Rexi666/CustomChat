name: CustomChat
version: '${version}'
main: org.rexi.customChat.CustomChat
api-version: '1.18'
author: Rexi666
depend: [PlaceholderAPI]
commands:
  customchat:
    description: Main command for CustomChat plugin
    aliases: [cc]
  chatcolor:
    description: Opens the chat color menu
    aliases: [colorchat]
  msg:
    description: Sends a private message to a player
    aliases: [message, tell]
  reply:
    description: Sends a private message to a recent player
    aliases: [r]
  ignore:
    description: Ignores a player, preventing them from sending you messages
    aliases: [block]
  spy:
    description: Spies on messages sent by a player
  chatlock:
    description: Locks the chat for all players except those with permission
    aliases: [lockchat]

permissions:
  customchat.format.default:
    description: Default format permission
    default: true
  customchat.mentiontoggle:
    description: Access to /customchat mentiontoggle
    default: true
  customchat.message:
    description: Access to /message
    default: true
  customchat.ignore:
    description: Access to /ignore
    default: true
  customchat.spy:
    description: Access to /spy
    default: op
  customchat.chatlock:
    description: Access to /chatlock
    default: op